<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tape la Banane</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

<div id="homeScreen">
    <h1>🍌 Tape la Banane !</h1>
    
    <img src="img/default_skin.png" alt="Grande banane" id="homeBanana"> 
    
    <p style="color:#777; font-size:1.1em; margin-bottom: 30px;">Clique sur la banane le plus vite possible pour gagner des Bananes.</p>
    
    <button id="playBtn" class="btn large-btn">JOUER</button>
</div>

<div id="gameArea" class="hidden"> 
    
    <div id="scoreBox">
        <div id="scoreCurrentLine">
            Score: <span id="scoreDisplay">0</span>
        </div>
        
        <div id="recordLine">
            Record: <span id="bestScoreDisplay">0</span> 
        </div>
        
        <div id="totalBananasLine">
            <i class="fas fa-money-bill-wave"></i> Total: <span id="totalBananasDisplay">0</span>
        </div>
    </div>
    
    <div id="activeBoostsIndicators">
        <div id="moneyBoostIndicator" class="boost-indicator hidden">
            💰 Bananes x2
        </div>
        <div id="shieldIndicator" class="boost-indicator hidden">
            🛡️ <span id="shieldName">Bouclier Actif</span> (<span id="shieldLife">0</span> Vies)
        </div>
    </div>
    
    <img id="mainBanana" src="img/default_skin.png" alt="banana"> 
    
</div>

<div id="gameOverScreen" class="hidden">
    <h2>FIN DE PARTIE</h2>
    <p>Votre Score : <span id="finalScoreDisplay">0</span></p>
    <button id="restartButton" class="btn" style="margin-top: 20px;">Rejouer</button>
</div>

<nav class="navBar">
  <a class="navBtn active" href="index.html">🏠</a>
  <a class="navBtn" href="shop.html">🛒</a>
  <a class="navBtn" href="inventory.html">🎒</a>
  <a class="navBtn" href="friends.html">👥</a>
  <a class="navBtn" href="ranking.html">🏆</a>
  <a class="navBtn" href="settings.html">⚙️</a>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
