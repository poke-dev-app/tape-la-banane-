<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Boutique Banane</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    
    <div class="card-box" id="shopHeader">
        <h2 style="margin-top: 0;">🛒 La Boutique</h2>

        <div class="banana-balance">
            <span id="currentBananas">0</span> <i class="fas fa-money-bill-wave"></i> Bananes
        </div>
    </div>
    
    <div class="shop-section">
        <h3>🎡 Grande Roue de la Fortune</h3>
        <div class="wheel-container">
            <div id="visualWheel" style="transition: transform 3s cubic-bezier(0.15, 0, 0.15, 1);">🎡</div>
            <div class="wheel-actions" style="margin-top: 20px;">
                <button class="btn gold-btn" onclick="playWheel(1)">Lancer (1 000 🍌)</button>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                    <button class="btn small-btn" onclick="playWheel(10)">x10 (10k)</button>
                    <button class="btn small-btn" onclick="playWheel(100)">x100 (100k)</button>
                </div>
            </div>
        </div>
    </div>

    <div id="shopContent">

        <div class="shop-section">
            <h3><i class="fas fa-bolt"></i> Améliorations</h3>
            <div id="upgrades-container"></div> 
        </div>

        <div class="shop-section">
            <h3>✨ Skins en Rotation</h3>
            <p class="muted">Renouvellement dans <span id="timeRemaining">03:00:00</span></p>
            
            <div class="item-grid" id="skinsGrid">
                <p class="muted" style="text-align: center;">Chargement des skins...</p>
            </div>
        </div>

        <div class="shop-section">
            <h3>🚀 Boosts</h3>
            
            <div class="item-grid" id="boostsGrid">
                </div>
        </div>
        
        <div class="shop-section">
                    <h3>💰 PUB</h3>
                    <p class="muted">Regardez des pubs pour obtenir des bananes gratuitement !</p>
            
                    <div class="shop-item card-box" style="border: 2px solid #FFD700; background: #FFF9C4;">
                        <h4>📺 Vidéo Gratuite</h4>
                        <p>Regarde une pub pour gagner 100 🍌</p>
                        <button class="btn gold-btn" id="rewardAdBtn">Regarder</button>
                    </div>
                </div>

            </div> <nav class="navBar">

    </div>

    <nav class="navBar">
        <a class="navBtn" href="index.html">🏠</a>
        <a class="navBtn active" href="shop.html">🛒</a>
        <a class="navBtn" href="inventory.html">🎒</a>
        <a class="navBtn" href="friends.html">👥</a>
        <a class="navBtn" href="ranking.html">🏆</a>
        <a class="navBtn" href="settings.html">⚙️</a>
    </nav>

    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/shop.js"></script>
</body>
</html>
